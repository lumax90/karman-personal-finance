name: karman
description: "Karman - The line between personal & business finance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  lucide_icons: ^0.257.0
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  purchases_flutter: ^8.6.0
  purchases_ui_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
