<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- K letter -->
  <text x="512" y="580" font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif" font-size="520" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">K</text>
  <!-- Karman line - the separator -->
  <rect x="160" y="720" width="704" height="4" rx="2" fill="url(#line)"/>
  <!-- Subtle glow on the line -->
  <rect x="160" y="718" width="704" height="8" rx="4" fill="url(#line)" opacity="0.3"/>
</svg>
